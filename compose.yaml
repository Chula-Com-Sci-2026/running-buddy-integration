{
  "name": "cra-delivery4",
  "services": {
    "postgres": {
      "image": "postgres:16-alpine",
      "environment": {
        "POSTGRES_PASSWORD": "${DB_PASSWORD:?Run scripts/init-env.py}"
      },
      "volumes": [
        "postgres_data:/var/lib/postgresql/data",
        "./scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-services.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      }
    },
    "redis": {
      "image": "redis:7-alpine",
      "command": [
        "redis-server",
        "--appendonly",
        "yes"
      ],
      "volumes": [
        "redis_data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      }
    },
    "rabbitmq": {
      "image": "rabbitmq:4.3.6-management",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "cra",
        "RABBITMQ_DEFAULT_PASS": "${BROKER_PASSWORD:?Run scripts/init-env.py}"
      },
      "ports": [
        "127.0.0.1:15678:15672"
      ],
      "volumes": [
        "rabbitmq_data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 30
      }
    },
    "identity": {
      "build": "../identity-service",
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgresql://identity:${DB_PASSWORD}@postgres:5432/identity",
        "OTP_ADAPTER": "console"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/up', timeout=3)"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20
      }
    },
    "profile-storage": {
      "image": "cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d",
      "command": [
        "server",
        "/data"
      ],
      "environment": {
        "MINIO_ROOT_USER": "cra-profile",
        "MINIO_ROOT_PASSWORD": "${PROFILE_STORAGE_SECRET:?Run scripts/init-env.py}"
      },
      "ports": [
        "127.0.0.1:${PROFILE_PHOTO_PORT:-9000}:9000"
      ],
      "volumes": [
        "profile_photos:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "mc",
          "ready",
          "local"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "profile-storage-bucket": {
      "image": "cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d",
      "depends_on": {
        "profile-storage": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "STORAGE_SECRET": "${PROFILE_STORAGE_SECRET}"
      },
      "entrypoint": [
        "sh",
        "-c",
        "printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::profile-service/*\"]}]}' > /tmp/public-read.json && mc alias set store http://profile-storage:9000 cra-profile \"$$STORAGE_SECRET\" && mc mb --ignore-existing store/profile-service && mc anonymous set-json /tmp/public-read.json store/profile-service"
      ]
    },
    "profile-broker-user": {
      "image": "rabbitmq:4.3.6-management",
      "restart": "no",
      "depends_on": {
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "BROKER_PASSWORD": "${BROKER_PASSWORD}"
      },
      "entrypoint": [
        "sh",
        "-c",
        "admin=\"rabbitmqadmin --host rabbitmq --username cra --password $$BROKER_PASSWORD\" && $$admin declare user --name profile --password \"$$BROKER_PASSWORD\" --tags '' && $$admin declare permissions --vhost / --username profile --configure '^cra\\.events$$' --write '^cra\\.events$$' --read '^$$'"
      ]
    },
    "profile-migrate": {
      "build": "../team-profile-service",
      "image": "cra-team-profile:local",
      "command": [
        "node",
        "dist/migrate.js"
      ],
      "environment": {
        "DATABASE_URL": "postgres://profile:${DB_PASSWORD}@postgres:5432/profile"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "profile": {
      "build": "../team-profile-service",
      "image": "cra-team-profile:local",
      "environment": {
        "PORT": "8000",
        "DATABASE_URL": "postgres://profile:${DB_PASSWORD}@postgres:5432/profile",
        "ACCESS_TOKEN_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "JWT_ISSUER": "cant-run-alone-local",
        "JWT_AUDIENCE": "cant-run-alone-services",
        "LOG_LEVEL": "info",
        "SHUTDOWN_DRAIN_MS": "3000",
        "OBJECT_STORAGE_ENDPOINT": "http://profile-storage:9000",
        "OBJECT_STORAGE_PUBLIC_ENDPOINT": "${PROFILE_PHOTO_PUBLIC_URL:-http://127.0.0.1:${PROFILE_PHOTO_PORT:-9000}}",
        "OBJECT_STORAGE_BUCKET": "profile-service",
        "OBJECT_STORAGE_ACCESS_KEY": "cra-profile",
        "OBJECT_STORAGE_SECRET_KEY": "${PROFILE_STORAGE_SECRET:?Run scripts/init-env.py}",
        "EVENT_SENDER": "rabbitmq",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_USER": "profile",
        "RABBITMQ_PASSWORD": "${BROKER_PASSWORD}"
      },
      "stop_grace_period": "20s",
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "profile-migrate": {
          "condition": "service_completed_successfully"
        },
        "profile-storage-bucket": {
          "condition": "service_completed_successfully"
        },
        "profile-broker-user": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "--eval",
          "fetch('http://127.0.0.1:8000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20
      },
      "restart": "unless-stopped"
    },
    "conditions": {
      "build": "../run-conditions-service",
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "REDIS_URL": "redis://redis:6379/0"
      },
      "depends_on": {
        "redis": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20
      }
    },
    "scheduling": {
      "build": "../run-scheduling-service",
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgresql://scheduling:${DB_PASSWORD}@postgres:5432/scheduling",
        "CONDITIONS_URL": "${CONDITIONS_URL:-http://conditions:8000}"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/up', timeout=3)"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20
      }
    },
    "notification-migrate": {
      "build": "../team-notification-service",
      "image": "cra-team-notification:local",
      "command": [
        "sh",
        "scripts/prestart.sh"
      ],
      "environment": {
        "ENVIRONMENT": "local",
        "ACCESS_TOKEN_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "JWT_ISSUER": "cant-run-alone-local",
        "JWT_AUDIENCE": "cant-run-alone-services",
        "POSTGRES_SERVER": "postgres",
        "POSTGRES_PORT": "5432",
        "POSTGRES_DB": "notification",
        "POSTGRES_USER": "notification",
        "POSTGRES_PASSWORD": "${DB_PASSWORD}",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_PORT": "5672",
        "RABBITMQ_USER": "cra",
        "RABBITMQ_PASSWORD": "${BROKER_PASSWORD}"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "notification": {
      "build": "../team-notification-service",
      "image": "cra-team-notification:local",
      "environment": {
        "ENVIRONMENT": "local",
        "ACCESS_TOKEN_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "JWT_ISSUER": "cant-run-alone-local",
        "JWT_AUDIENCE": "cant-run-alone-services",
        "POSTGRES_SERVER": "postgres",
        "POSTGRES_PORT": "5432",
        "POSTGRES_DB": "notification",
        "POSTGRES_USER": "notification",
        "POSTGRES_PASSWORD": "${DB_PASSWORD}",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_PORT": "5672",
        "RABBITMQ_USER": "cra",
        "RABBITMQ_PASSWORD": "${BROKER_PASSWORD}"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "notification-migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8000/up"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20
      },
      "restart": "unless-stopped"
    },
    "notification-worker": {
      "build": "../team-notification-service",
      "image": "cra-team-notification:local",
      "command": [
        "python",
        "-m",
        "app.consumer"
      ],
      "restart": "unless-stopped",
      "environment": {
        "ENVIRONMENT": "local",
        "ACCESS_TOKEN_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "JWT_ISSUER": "cant-run-alone-local",
        "JWT_AUDIENCE": "cant-run-alone-services",
        "POSTGRES_SERVER": "postgres",
        "POSTGRES_PORT": "5432",
        "POSTGRES_DB": "notification",
        "POSTGRES_USER": "notification",
        "POSTGRES_PASSWORD": "${DB_PASSWORD}",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_PORT": "5672",
        "RABBITMQ_USER": "cra",
        "RABBITMQ_PASSWORD": "${BROKER_PASSWORD}"
      },
      "depends_on": {
        "notification-migrate": {
          "condition": "service_completed_successfully"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "test",
          "-f",
          "/tmp/notification-consumer-ready"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "gateway": {
      "build": "../api-gateway",
      "environment": {
        "FRONTEND_ORIGINS": "${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}",
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "IDENTITY_URL": "${IDENTITY_URL:-http://identity:8000}",
        "PROFILE_URL": "${PROFILE_URL:-http://profile:8000}",
        "CONDITIONS_URL": "${CONDITIONS_URL:-http://conditions:8000}",
        "SCHEDULING_URL": "${SCHEDULING_URL:-http://scheduling:8000}",
        "NOTIFICATION_URL": "${NOTIFICATION_URL:-http://notification:8000}",
        "REPUTATION_URL": "${REPUTATION_URL:-http://reputation:3000}",
        "TRUST_SAFETY_URL": "${TRUST_SAFETY_URL:-http://trust-safety:8000}",
        "DISCOVERY_TARGET": "${DISCOVERY_TARGET:-discovery:50051}"
      },
      "depends_on": {},
      "restart": "unless-stopped",
      "ports": [
        "127.0.0.1:${GATEWAY_PORT:-8088}:8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/up', timeout=3)"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20
      }
    },
    "discovery": {
      "build": {
        "context": "../buddy-discovery-service",
        "dockerfile": "Dockerfile.dev"
      },
      "command": [
        "sh",
        "-c",
        "bin/rails db:prepare && bin/grpc-server"
      ],
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgres://discovery:${DB_PASSWORD}@postgres:5432/discovery",
        "PROFILE_URL": "${PROFILE_URL:-http://profile:8000}",
        "TEST_DATABASE_URL": "postgres://discovery:${DB_PASSWORD}@postgres:5432/discovery_test"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "reputation": {
      "build": {
        "context": "../reputation-service",
        "dockerfile": "Dockerfile.dev"
      },
      "command": [
        "sh",
        "-c",
        "rm -f tmp/pids/server.pid && bin/rails db:prepare && exec bin/rails server -b 0.0.0.0"
      ],
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgres://reputation:${DB_PASSWORD}@postgres:5432/reputation",
        "SCHEDULING_URL": "${SCHEDULING_URL:-http://scheduling:8000}",
        "TEST_DATABASE_URL": "postgres://reputation:${DB_PASSWORD}@postgres:5432/reputation_test"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "ruby",
          "-rnet/http",
          "-e",
          "exit(Net::HTTP.get_response(URI('http://localhost:3000/up')).code == '200' ? 0 : 1)"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20,
        "start_period": "20s"
      }
    },
    "discovery-outbox": {
      "build": {
        "context": "../buddy-discovery-service",
        "dockerfile": "Dockerfile.dev"
      },
      "command": [
        "bin/outbox-worker"
      ],
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgres://discovery:${DB_PASSWORD}@postgres:5432/discovery",
        "BROKER_HTTP_URL": "http://rabbitmq:15672",
        "BROKER_USER": "cra",
        "BROKER_PASSWORD": "${BROKER_PASSWORD}"
      },
      "depends_on": {
        "discovery": {
          "condition": "service_started"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "trust-safety": {
      "build": "../trust-safety-service",
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgresql://trust_safety:${DB_PASSWORD}@postgres:5432/trust_safety",
        "MODERATOR_IDS": "${MODERATOR_IDS:-}",
        "IDENTITY_LOCK_URL": "${IDENTITY_LOCK_URL:-}"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/up', timeout=3)"
        ],
        "interval": "5s",
        "timeout": "4s",
        "retries": 20
      }
    },
    "trust-safety-worker": {
      "build": "../trust-safety-service",
      "command": [
        "python",
        "worker.py"
      ],
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgresql://trust_safety:${DB_PASSWORD}@postgres:5432/trust_safety",
        "AMQP_URL": "amqp://cra:${BROKER_PASSWORD}@rabbitmq:5672/%2F"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "trust-safety-publisher": {
      "build": "../trust-safety-service",
      "command": [
        "python",
        "publisher.py"
      ],
      "environment": {
        "JWT_SECRET": "${JWT_SECRET:?Run scripts/init-env.py}",
        "DATABASE_URL": "postgresql://trust_safety:${DB_PASSWORD}@postgres:5432/trust_safety",
        "BROKER_HTTP_URL": "http://rabbitmq:15672",
        "BROKER_USER": "cra",
        "BROKER_PASSWORD": "${BROKER_PASSWORD}"
      },
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "rabbitmq": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "tools": {
      "build": "../api-gateway",
      "profiles": [
        "tools"
      ],
      "working_dir": "/checks",
      "volumes": [
        "./scripts:/checks:ro",
        "./contracts:/contracts"
      ],
      "environment": {
        "DB_PASSWORD": "${DB_PASSWORD}",
        "JWT_SECRET": "${JWT_SECRET}",
        "DISCOVERY_TARGET": "discovery:50051",
        "IDENTITY_URL": "http://identity:8000",
        "PROFILE_URL": "http://profile:8000",
        "CONDITIONS_URL": "http://conditions:8000",
        "SCHEDULING_URL": "http://scheduling:8000",
        "NOTIFICATION_URL": "http://notification:8000",
        "REPUTATION_URL": "http://reputation:3000",
        "TRUST_SAFETY_URL": "http://trust-safety:8000",
        "AMQP_URL": "amqp://cra:${BROKER_PASSWORD}@rabbitmq:5672/%2F"
      },
      "command": [
        "python",
        "check_flows.py"
      ]
    }
  },
  "volumes": {
    "postgres_data": {},
    "redis_data": {},
    "rabbitmq_data": {},
    "profile_photos": {}
  }
}
