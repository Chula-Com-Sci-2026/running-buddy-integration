# Run after compose.yaml. The original Python service and its database remain available for rollback.
services:
  identity:
    image: cra-delivery4-team-identity:pr
    build:
      context: ../team-identity-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: '5000'
      DATABASE_URL: postgresql://identity:${DB_PASSWORD}@postgres:5432/identity_team
      TEST_DATABASE_URL: postgresql://identity:${DB_PASSWORD}@postgres:5432/identity_team_test
      ACCESS_TOKEN_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${TEAM_IDENTITY_REFRESH_SECRET:?Run scripts/init-env.py}
      JWT_ISSUER: cant-run-alone-local
      JWT_AUDIENCE: cant-run-alone-services
      ACCESS_TOKEN_EXPIRY: 15m
      REQUIRE_PHONE_VERIFICATION: 'true'
      AUTO_SEND_PHONE_OTP: 'true'
      OTP_DELIVERY: console
      AUTO_MIGRATE: 'true'
      COOKIE_SECURE: 'false'
      RABBITMQ_REQUIRED: 'true'
      RABBITMQ_URL: amqp://cra:${BROKER_PASSWORD}@rabbitmq:5672/%2F
      NOTIFICATION_QUEUE: identity.email.v1
    depends_on:
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5000/up').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  gateway:
    environment:
      IDENTITY_URL: http://identity:5000
  team-identity-worker:
    build: ../team-identity-service
    command: [node, workers/notificationWorker.js]
    environment:
      RABBITMQ_URL: amqp://cra:${BROKER_PASSWORD}@rabbitmq:5672/%2F
      NOTIFICATION_QUEUE: identity.email.v1
      EMAIL_DELIVERY: console
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
  tools:
    environment:
      IDENTITY_BACKEND: team
      IDENTITY_URL: http://identity:5000
