# Idempotent operator step (replaces Compose's first-boot init script): one login role and one
# owned database per service. Re-running it creates only what is missing and never drops data.
# Application roles get no CREATEDB/superuser rights. Team Identity owns identity_team, as in
# compose.team-identity.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  labels: {app.kubernetes.io/component: db-bootstrap}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGUSER, value: postgres}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: cra-secrets, key: POSTGRES_PASSWORD}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: cra-secrets, key: DB_PASSWORD}}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              until pg_isready -q; do echo 'waiting for postgres'; sleep 2; done
              for pair in identity:identity_team profile:profile scheduling:scheduling \
                          notification:notification discovery:discovery reputation:reputation; do
                role="${pair%%:*}" database="${pair#*:}"
                psql -v ON_ERROR_STOP=1 -d postgres -v role="$role" -v database="$database" -v password="$DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
              ALTER ROLE :"role" WITH LOGIN PASSWORD :'password';
              SELECT format('CREATE DATABASE %I OWNER %I', :'database', :'role') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database') \gexec
              SQL
                echo "ready: role=$role database=$database"
              done
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
