---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-profile-storage
  labels: {app.kubernetes.io/component: migration}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        # Creates Profile's bucket: anyone may read a photo by its address, nobody may list it.
        - name: bucket
          image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
          command:
            - sh
            - -c
            - >-
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::profile-service/*"]}]}' > /tmp/public-read.json &&
              mc alias set store http://profile-storage:9000 cra-profile "$STORAGE_SECRET" &&
              mc mb --ignore-existing store/profile-service &&
              mc anonymous set-json /tmp/public-read.json store/profile-service
          env:
            - name: STORAGE_SECRET
              valueFrom: {secretKeyRef: {name: cra-secrets, key: PROFILE_STORAGE_SECRET}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-profile-broker-user
  labels: {app.kubernetes.io/component: migration}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        # Profile publishes as its own broker user, allowed to configure and write cra.events only.
        - name: broker-user
          image: rabbitmq:4.3.6-management
          command:
            - sh
            - -c
            - >-
              admin="rabbitmqadmin --host rabbitmq --username cra --password $BROKER_PASSWORD" &&
              $admin declare user --name profile --password "$BROKER_PASSWORD" --tags '' &&
              $admin declare permissions --vhost / --username profile --configure '^cra\.events$' --write '^cra\.events$' --read '^$'
          env:
            - name: BROKER_PASSWORD
              valueFrom: {secretKeyRef: {name: cra-secrets, key: BROKER_PASSWORD}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-scheduling
  labels: {app.kubernetes.io/component: migration}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cra/scheduling:local
          imagePullPolicy: Never
          command: ["python", "-c", "from common import migrate; migrate(); print('scheduling migrated')"]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: cra-secrets, key: DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://scheduling:$(DB_PASSWORD)@postgres:5432/scheduling"}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-notification
  labels: {app.kubernetes.io/component: migration}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cra/notification:local
          imagePullPolicy: Never
          command: ["sh", "scripts/prestart.sh"]
          env:
            - {name: ENVIRONMENT, value: local}
            - name: ACCESS_TOKEN_SECRET
              valueFrom: {secretKeyRef: {name: cra-secrets, key: JWT_SECRET}}
            - {name: POSTGRES_SERVER, value: postgres}
            - {name: POSTGRES_DB, value: notification}
            - {name: POSTGRES_USER, value: notification}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: cra-secrets, key: DB_PASSWORD}}
---
